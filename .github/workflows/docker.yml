name: imagem docker

# Constrói a imagem e publica no GitHub Container Registry a cada push na main.
# O gerenciador do Hostinger só baixa imagens prontas (não executa "build").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/moisesoliveira-dev/relatorios_automaticos_backend:latest
            ghcr.io/moisesoliveira-dev/relatorios_automaticos_backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
